[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealth-showcase"
version = "0.1.3"
description = "Offline financial dashboard with entirely synthetic data"
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_os"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
